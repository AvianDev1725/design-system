# SonarQube project config — read by `npx sonar-scanner` in the
# Jenkins pipeline's "SonarQube Quality Gate" stage.
#
# Real values from sonarcloud.io/api/organizations — org key comes
# from the GitHub account SonarCloud is linked to (aviandev1725, not
# avian-dev — SonarCloud doesn't lowercase/normalize the org's actual
# key the way the npm scope does), project key is what SonarCloud
# assigned on import.
sonar.projectKey=AvianDev1725_design-system
sonar.projectName=Avian Dev - Design System
sonar.organization=aviandev1725

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.stories.tsx,dist/**,storybook-static/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json

sonar.sourceEncoding=UTF-8
