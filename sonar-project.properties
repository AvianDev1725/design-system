# SonarQube project config — read by `npx sonar-scanner` in the
# Jenkins pipeline's "SonarQube Quality Gate" stage.
#
# ACTION NEEDED (SonarCloud): sonar.organization below is a placeholder
# — SonarCloud assigns your real org key when you sign up and import
# this repo (Analyze new project). It's usually derived from your
# GitHub username/org but isn't guaranteed to match exactly — check
# sonarcloud.io's project setup page and update both lines below to
# what it actually shows. `sonar.projectKey` can stay as-is or be
# whatever key you pick during import, as long as the two match.
sonar.projectKey=avian-dev_design-system
sonar.projectName=Avian Dev - Design System
sonar.organization=avian-dev

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.stories.tsx,dist/**,storybook-static/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json

sonar.sourceEncoding=UTF-8
